<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gioca — Quiz di Storia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        :root {
            --ink: #101826; --ink-2: #182338; --gold: #c9a461; --gold-dim: #8f7947;
            --parchment: #e8e4d9; --parchment-dim: #a9a599; --line: #2b3650;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--ink); color: var(--parchment); font-family: 'Inter', sans-serif; }
        .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; }

        nav { border-bottom: 1px solid var(--line); padding: 20px 0; }
        nav .wrap { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-family: 'Spectral', serif; font-size: 20px; color: var(--gold); text-decoration: none; }
        .navlinks a { color: var(--parchment-dim); text-decoration: none; margin-left: 28px; font-size: 14px; }
        .navlinks a:hover { color: var(--gold); }

        header.page { padding: 48px 0 6px; }
        header.page h1 { font-family: 'Spectral', serif; font-size: 34px; margin: 0 0 6px; }
        header.page .count { color: var(--parchment-dim); font-size: 14px; }

        form.settings {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
            margin: 28px 0 8px;
            padding: 16px 18px;
            background: var(--ink-2);
            border: 1px solid var(--line);
        }
        form.settings .field { display: flex; flex-direction: column; gap: 6px; }
        form.settings label { color: var(--gold-dim); font-size: 12px; }
        form.settings input, form.settings select {
            background: var(--ink);
            border: 1px solid var(--line);
            color: var(--parchment);
            font-size: 13px;
            padding: 8px 10px;
            font-family: 'Inter', sans-serif;
            min-width: 100px;
        }
        form.settings input:focus, form.settings select:focus { outline: none; border-color: var(--gold); }
        form.settings button {
            background: none;
            border: 1px solid var(--line);
            color: var(--parchment);
            padding: 9px 18px;
            font-size: 13px;
            cursor: pointer;
        }
        form.settings button:hover { border-color: var(--gold-dim); }

        .qcard {
            border: 1px solid var(--line);
            padding: 24px;
            margin: 22px 0;
            background: var(--ink-2);
        }
        .qcard .num { color: var(--gold-dim); font-size: 12px; margin-bottom: 10px; }
        .qcard .type {
            display: inline-block; border: 1px solid var(--line); color: var(--parchment-dim);
            font-size: 11px; padding: 3px 9px; margin-bottom: 14px;
        }
        .qcard .contents { font-size: 17px; line-height: 1.5; margin-bottom: 18px; }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--line);
            padding: 12px 14px;
            cursor: pointer;
            font-size: 14px;
        }
        .option:hover { border-color: var(--gold-dim); }
        .option input[type="radio"] { accent-color: var(--gold); }

        .empty { color: var(--parchment-dim); padding: 40px 0; font-size: 14px; }

        .submit-quiz {
            display: block;
            width: 100%;
            background: var(--gold);
            color: var(--ink);
            border: none;
            padding: 15px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin: 30px 0 70px;
        }
        .submit-quiz:hover { opacity: 0.88; }
    </style>
</head>
<body>
    <nav>
        <div class="wrap">
            <a class="brand" href="/quiz">Quiz di Storia</a>
            <div class="navlinks">
                <a th:href="@{/quiz/events}">Eventi</a>
                <a th:href="@{/quiz/questions}">Domande</a>
                <a th:href="@{/quiz/questions/play}">Gioca</a>
            </div>
        </div>
    </nav>

    <div class="wrap">
        <header class="page">
            <h1>Mettiti alla prova</h1>
            <div class="count" th:text="${questions.size()} + ' domande in questo turno'">0 domande</div>
        </header>

        <form class="settings" th:action="@{/quiz/questions/play}" method="get">
            <div class="field">
                <label for="limit">Numero domande</label>
                <input type="number" id="limit" name="limit" min="1" max="50" th:value="${limit}" />
            </div>
            <div class="field">
                <label for="difficulty">Difficoltà</label>
                <select id="difficulty" name="difficulty">
                    <option th:each="d : ${difficulties}"
                            th:value="${d}"
                            th:text="${d}"
                            th:selected="${d == difficulty}"></option>
                </select>
            </div>
            <button type="submit">Genera nuovo turno</button>
        </form>

        <form th:if="${!questions.isEmpty()}" th:action="@{/quiz/questions/submit}" method="post">
            <input type="hidden" th:each="q : ${questions}" name="questionIds" th:value="${q.id}" />

            <div class="qcard" th:each="q, iter : ${questions}">
                <div class="num" th:text="'Domanda ' + ${iter.count}">Domanda 1</div>
                <div class="type" th:text="${q.type}">TIPO</div>
                <div class="contents" th:text="${q.contents}">Testo della domanda</div>

                <div class="options">
                    <label class="option" th:each="opt : ${q.opzioni}">
                        <input type="radio" th:name="'risposta_' + ${q.id}" th:value="${opt}" required />
                        <span th:text="${opt}">Opzione</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-quiz">Consegna il quiz</button>
        </form>

        <p class="empty" th:if="${questions.isEmpty()}">Nessuna domanda disponibile. Aggiungi qualche evento per generarne.</p>
    </div>
</body>
</html>

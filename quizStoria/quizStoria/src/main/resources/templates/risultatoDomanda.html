<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Risultato — Quiz di Storia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        :root {
            --ink: #101826; --ink-2: #182338; --gold: #c9a461; --gold-dim: #8f7947;
            --parchment: #e8e4d9; --parchment-dim: #a9a599; --line: #2b3650;
            --good: #7fae8f; --bad: #cf7d6c;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--ink); color: var(--parchment); font-family: 'Inter', sans-serif; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px; }

        nav { border-bottom: 1px solid var(--line); padding: 20px 0; }
        nav .wrap { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-family: 'Spectral', serif; font-size: 20px; color: var(--gold); text-decoration: none; }
        .navlinks a { color: var(--parchment-dim); text-decoration: none; margin-left: 28px; font-size: 14px; }
        .navlinks a:hover { color: var(--gold); }

        .result-panel { padding: 70px 0 20px; text-align: center; }
        .verdict {
            font-family: 'Spectral', serif;
            font-size: 30px;
            margin: 0 0 8px;
        }
        .verdict.correct { color: var(--good); }
        .verdict.wrong { color: var(--bad); }

        .question { color: var(--parchment-dim); font-size: 15px; margin: 24px 0 30px; line-height: 1.5; }

        .compare { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 24px 0; margin-bottom: 40px; text-align: left; }
        .compare .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
        .compare .label { color: var(--parchment-dim); }
        .compare .value { font-weight: 500; }
        .compare .value.correct { color: var(--good); }
        .compare .value.wrong { color: var(--bad); }

        .actions { display: flex; gap: 14px; justify-content: center; margin-bottom: 70px; }
        .btn { padding: 12px 24px; font-size: 14px; text-decoration: none; border-radius: 2px; font-weight: 500; }
        .btn-primary { background: var(--gold); color: var(--ink); }
        .btn-primary:hover { opacity: 0.88; }
        .btn-ghost { border: 1px solid var(--line); color: var(--parchment); }
        .btn-ghost:hover { border-color: var(--gold-dim); }
    </style>
</head>
<body>
    <nav>
        <div class="wrap">
            <a class="brand" href="/quiz">Quiz di Storia</a>
            <div class="navlinks">
                <a th:href="@{/quiz/events}">Eventi</a>
                <a th:href="@{/quiz/questions/play}">Gioca</a>
            </div>
        </div>
    </nav>

    <div class="wrap">
        <div class="result-panel">
            <p class="verdict correct" th:if="${isCorrect}">Risposta corretta</p>
            <p class="verdict wrong" th:unless="${isCorrect}">Risposta errata</p>

            <p class="question" th:text="${domanda.contents}">Testo della domanda</p>

            <div class="compare">
                <div class="row">
                    <span class="label">La tua risposta</span>
                    <span class="value" th:classappend="${isCorrect} ? 'correct' : 'wrong'" th:text="${userAnswer}">risposta utente</span>
                </div>
                <div class="row" th:if="${correctAnswer != null}">
                    <span class="label">Risposta corretta</span>
                    <span class="value correct" th:text="${correctAnswer}">risposta corretta</span>
                </div>
            </div>

            <div class="actions">
                <a class="btn btn-primary" th:href="@{/quiz/questions/play}">Prossimo turno</a>
                <a class="btn btn-ghost" th:href="@{/quiz/events}">Vedi eventi</a>
            </div>
        </div>
    </div>
</body>
</html>

    </div>

</body>
</html>

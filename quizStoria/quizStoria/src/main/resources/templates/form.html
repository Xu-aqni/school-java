<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo evento — Quiz di Storia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        :root {
            --ink: #101826; --ink-2: #182338; --gold: #c9a461; --gold-dim: #8f7947;
            --parchment: #e8e4d9; --parchment-dim: #a9a599; --line: #2b3650;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--ink); color: var(--parchment); font-family: 'Inter', sans-serif; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px; }

        nav { border-bottom: 1px solid var(--line); padding: 20px 0; }
        nav .wrap { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-family: 'Spectral', serif; font-size: 20px; color: var(--gold); text-decoration: none; }
        .navlinks a { color: var(--parchment-dim); text-decoration: none; margin-left: 28px; font-size: 14px; }
        .navlinks a:hover { color: var(--gold); }

        .back { display: inline-block; margin: 40px 0 0; color: var(--parchment-dim); text-decoration: none; font-size: 13px; }
        .back:hover { color: var(--gold); }

        h1 { font-family: 'Spectral', serif; font-size: 34px; margin: 24px 0 6px; }
        .sub { color: var(--parchment-dim); font-size: 14px; margin-bottom: 36px; }

        form { display: flex; flex-direction: column; gap: 22px; margin-bottom: 70px; }
        .field label { display: block; font-size: 12px; color: var(--gold-dim); margin-bottom: 8px; }
        .field input, .field textarea {
            width: 100%;
            background: var(--ink-2);
            border: 1px solid var(--line);
            color: var(--parchment);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            padding: 12px 14px;
        }
        .field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
        .field textarea { min-height: 110px; resize: vertical; }

        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

        .submit-row { display: flex; gap: 14px; margin-top: 8px; }
        .btn { padding: 13px 26px; font-size: 15px; border-radius: 2px; font-weight: 500; border: none; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--gold); color: var(--ink); }
        .btn-primary:hover { opacity: 0.88; }
    </style>
</head>
<body>
    <nav>
        <div class="wrap">
            <a class="brand" href="/quiz">Quiz di Storia</a>
            <div class="navlinks">
                <a th:href="@{/quiz/events}">Eventi</a>
                <a th:href="@{/quiz/questions}">Domande</a>
                <a th:href="@{/quiz/questions/play}">Gioca</a>
            </div>
        </div>
    </nav>

<div class="wrap">
    <a class="back" th:href="@{/quiz/events}">&larr; Torna agli eventi</a>
    
    <!-- Titolo dinamico -->
    <h1 th:text="${event.id != null} ? 'Modifica evento' : 'Aggiungi un evento'">Aggiungi un evento</h1>
    <p class="sub">Le domande del quiz verranno generate automaticamente a partire da questi dati.</p>

    <!-- Action dinamica: sceglie POST /quiz/events/{id} se l'ID esiste, altrimenti POST /quiz/events -->
    <form th:action="${event.id != null} ? @{/quiz/events/{id}(id=${event.id})} : @{/quiz/events}" 
          th:object="${event}" 
          method="post">

        <!-- Campo nascosto per preservare l'ID durante la modifica -->
        <input type="hidden" th:field="*{id}" />

        <div class="row2">
            <div class="field">
                <label for="anno">Anno</label>
                <input type="number" id="anno" th:field="*{anno}" required />
            </div>
            <div class="field">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" th:field="*{categoria}" required />
            </div>
        </div>

        <div class="field">
            <label for="titolo">Titolo</label>
            <input type="text" id="titolo" th:field="*{titolo}" required />
        </div>

        <div class="row2">
            <div class="field">
                <label for="luogo">Luogo</label>
                <input type="text" id="luogo" th:field="*{luogo}" required />
            </div>
            <div class="field">
                <label for="civilta">Civiltà</label>
                <input type="text" id="civilta" th:field="*{civilta}" required />
            </div>
        </div>

        <div class="field">
            <label for="descrizione">Descrizione</label>
            <textarea id="descrizione" th:field="*{descrizione}"></textarea>
        </div>

        <div class="submit-row">
            <button type="submit" class="btn btn-primary" th:text="${event.id != null} ? 'Aggiorna evento' : 'Salva evento'">Salva evento</button>
        </div>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz di Storia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --ink: #101826;
            --ink-2: #182338;
            --gold: #c9a461;
            --gold-dim: #8f7947;
            --parchment: #e8e4d9;
            --parchment-dim: #a9a599;
            --line: #2b3650;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--ink);
            color: var(--parchment);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        nav {
            border-bottom: 1px solid var(--line);
            padding: 20px 0;
        }
        nav .wrap { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-family: 'Spectral', serif; font-size: 20px; color: var(--gold); text-decoration: none; letter-spacing: 0.3px; }
        .navlinks a { color: var(--parchment-dim); text-decoration: none; margin-left: 28px; font-size: 14px; }
        .navlinks a:hover { color: var(--gold); }

        .hero {
            padding: 120px 0 90px;
            position: relative;
        }
        .hero-eyebrow {
            color: var(--gold-dim);
            font-size: 14px;
            margin-bottom: 18px;
        }
        .hero h1 {
            font-family: 'Spectral', serif;
            font-weight: 600;
            font-size: 54px;
            line-height: 1.1;
            margin: 0 0 22px;
            max-width: 11ch;
        }
        .hero h1 em { color: var(--gold); font-style: normal; }
        .hero p {
            font-size: 17px;
            line-height: 1.6;
            color: var(--parchment-dim);
            max-width: 46ch;
            margin: 0 0 40px;
        }

        .timeline-strip {
            display: flex;
            align-items: center;
            gap: 0;
            margin: 0 0 48px;
            overflow: hidden;
        }
        .timeline-strip .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--gold-dim);
            flex: none;
        }
        .timeline-strip .rule { height: 1px; background: var(--line); flex: 1; }

        .cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            padding: 13px 26px;
            font-size: 15px;
            text-decoration: none;
            border-radius: 2px;
            font-weight: 500;
            transition: opacity 0.15s ease;
        }
        .btn-primary { background: var(--gold); color: var(--ink); }
        .btn-primary:hover { opacity: 0.88; }
        .btn-ghost { border: 1px solid var(--line); color: var(--parchment); }
        .btn-ghost:hover { border-color: var(--gold-dim); }

        .footer-note {
            border-top: 1px solid var(--line);
            padding: 26px 0 60px;
            color: var(--parchment-dim);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="wrap">
            <a class="brand" href="/quiz">Quiz di Storia</a>
            <div class="navlinks">
                <a th:href="@{/quiz/events}">Eventi</a>
                <a th:href="@{/quiz/questions}">Domande</a>
                <a th:href="@{/quiz/questions/play}">Gioca</a>
            </div>
        </div>
    </nav>

    <div class="wrap">
        <div class="hero">
            <h1>Quanto conosci la <em>storia</em>?</h1>

            <div class="timeline-strip">
                <div class="dot"></div><div class="rule"></div>
                <div class="dot"></div><div class="rule"></div>
                <div class="dot"></div><div class="rule"></div>
                <div class="dot"></div>
            </div>

            <div class="cta-row">
                <a class="btn btn-primary" th:href="@{/quiz/questions/play}">Inizia il quiz</a>
                <a class="btn btn-ghost" th:href="@{/quiz/events}">Sfoglia gli eventi</a>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <div class="wrap">Esercitazione quizStoria</div>
    </div>
</body>
</html>

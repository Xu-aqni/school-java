<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Lista Eventi</title>
  <style>
    th {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Lista degli Eventi</h1>

  <!-- Event Count -->
  <p>Totale eventi trovati: <b th:text="${eventCount}">0</b></p>

  <li><a th:href="@{/quiz/events/oldest}">Evento più antico</a></li>
  <li><a th:href="@{/quiz/events/newest}">Evento più recente</a></li>

  <a th:href="@{/quiz/events/add}">Aggiungi evento</a>

  <!-- Search Form -->
  <h3>Cerca Eventi</h3>
  <form th:action="@{/quiz/events/search}" method="get">
    <input type="number" name="anno" placeholder="Anno (es. -3500)">
    <input type="text" name="titolo" placeholder="Titolo">
    <input type="text" name="luogo" placeholder="Luogo">
    <input type="text" name="civilta" placeholder="Civiltà">
    <input type="text" name="categoria" placeholder="Categoria">
    <button type="submit">Cerca</button>
    <a th:href="@{/quiz/events}">Reset</a>
  </form>

  <hr>

  <!-- Table of Events -->
  <table border="1" cellpadding="8" id="eventsTable">
    <thead>
      <tr>
        <th onclick="sortTable(0)">ID ↕</th>
        <th onclick="sortTable(1)">Anno ↕</th>
        <th onclick="sortTable(2)">Titolo ↕</th>
        <th onclick="sortTable(3)">Luogo ↕</th>
        <th onclick="sortTable(4)">Civiltà ↕</th>
        <th onclick="sortTable(5)">Categoria ↕</th>
        <th>Azioni</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="event : ${events}">
        <td th:text="${event.id}">1</td>
        <td th:text="${event.anno}">-3500</td>
        <td th:text="${event.titolo}">Nascita della scrittura</td>
        <td th:text="${event.luogo}">Mesopotamia</td>
        <td th:text="${event.civilta}">Sumeri</td>
        <td th:text="${event.categoria}">cultura</td>
        <td>
          <a th:href="@{/quiz/events/{id}(id=${event.id})}">Dettagli</a>

          <!-- Delete Form -->
          <form th:action="@{/quiz/events/{id}/delete(id=${event.id})}" method="post" style="display:inline;">
            <button type="submit" onclick="return confirm('Sei sicuro?')">Elimina</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <hr>

  <a th:href="@{/quiz}">Torna alla Home</a>

  <!-- JavaScript for Header Sorting -->
  <script>
    let currentColumn = -1;
    let asc = true;

    function sortTable(n) {
      const tbody = document.querySelector("#eventsTable tbody");
      const rows = Array.from(tbody.querySelectorAll("tr"));

      // Toggle direction if clicking the SAME column, or default to DESCENDING (false) for a NEW column
      if (currentColumn === n) {
        asc = !asc;
      } else {
        currentColumn = n;
        asc = true; // First click on a new column starts DESCENDING (highest to lowest)
      }

      rows.sort((a, b) => {
        let valA = a.children[n].innerText.trim();
        let valB = b.children[n].innerText.trim();

        let diff = (!isNaN(valA) && !isNaN(valB))
          ? valA - valB
          : valA.localeCompare(valB);

        // When asc is false, -diff turns ascending into descending (highest to lowest)
        return asc ? diff : -diff;
      });

      rows.forEach(row => tbody.appendChild(row));
    }
  </script>
</body>

</html>

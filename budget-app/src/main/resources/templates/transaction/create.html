<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuova Transazione - Budget App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1>Nuova transazione</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/transactions}" enctype="multipart/form-data">
        <label>Descrizione</label>
        <input type="text" name="description" required>

        <label>Data</label>
        <input type="date" name="date" required th:value="${T(java.time.LocalDate).now()}">

        <label>Importo (&euro;)</label>
        <input type="number" step="0.01" min="0.01" name="amount" required>

        <label>Categoria</label>
        <select name="category" required>
            <option th:each="c : ${categories}" th:value="${c.label}" th:text="${c.label}"></option>
        </select>

        <label>Ricevuta (immagine o PDF, opzionale)</label>
        <input type="file" name="receipt" accept="image/*,application/pdf">

        <button type="submit">Salva</button>
    </form>
</div>
</body>
</html>

spring.application.name=budget-app

# ---- Database ----
# Configurazione di default: H2 in memoria, utile per avviare subito l'app senza installare nulla.
# Per usare MySQL (come nel progetto PHP originale) commenta il blocco H2 e scommenta il blocco MySQL sotto.

spring.datasource.url=jdbc:h2:mem:budgetdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (alternativa) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/budget_app?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Upload ricevute ----
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Sessione ----
server.servlet.session.timeout=30m

spring.thymeleaf.cache=false

spring.application.name=ProducerConsumer

# PostgreSQL Connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/Storia

# Credentials
spring.datasource.username=postgres
spring.datasource.password=Password

# Creates the database tables automatically every time the app starts
spring.jpa.hibernate.ddl-auto=update


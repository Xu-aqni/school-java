spring.application.name=ProducerConsumer

server.port=8081

# PostgreSQL Connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/esercitazione_api

# Database Credentials
spring.datasource.username=postgres
spring.datasource.password=Password

# Creates the database tables automatically every time the app starts
spring.jpa.hibernate.ddl-auto=update

# Shows executed sql queries
spring.jpa.show-sql=true

# Format shown queries to make them more readable
spring.jpa.properties.hibernate.format_sql=true
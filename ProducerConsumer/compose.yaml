services:
  db:
    image: postgres:15-alpine
    container_name: esercitazione-db
    environment:
      POSTGRES_DB: esercitazione_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  producer:
    build: ./ProducerApplication
    container_name: esercitazione-producer
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/esercitazione_api
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Password
    ports:
      - "8081:8081"
    depends_on:
      - db

  consumer:
    build: ./ConsumerApplication
    container_name: esercitazione-consumer
    environment:
      PRODUCER_URL: http://producer:8081
    ports:
      - "8082:8082"
    depends_on:
      - producer

volumes:
  postgres-data:
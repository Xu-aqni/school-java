spring.application.name=ProducerConsumer

server.port=8081

# PostgreSQL Connection URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/esercitazione_api}

# Database Credentials
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password}

# Creates the database tables automatically every time the app starts
spring.jpa.hibernate.ddl-auto=update

# Shows executed sql queries
spring.jpa.show-sql=true

# Format shown queries to make them more readable
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=user
spring.security.user.password=password123